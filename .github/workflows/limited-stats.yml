name: Refresh limited stats

# Rebuilds data/limited-stats/ from 17Lands' public datasets (CC BY 4.0).
# Incremental: only sets whose 17Lands file changed are rebuilt, and new sets are picked up
# automatically once 17Lands publishes them (~2 weeks after release). A commit to main
# redeploys the app through Firebase App Hosting.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC (3:17 AM CST / 4:17 AM CDT)
  workflow_dispatch:
    inputs:
      sets:
        description: "Comma-separated set codes to rebuild (blank = all, incremental)"
        required: false
      force:
        description: "Rebuild even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: limited-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats
        env:
          SETS: ${{ github.event.inputs.sets }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args="--with-draft"
          if [ -n "$SETS" ]; then args="$args --sets $SETS"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python -I scripts/build_limited_stats.py $args

      - name: Commit changes
        # Keep the sets that built even if another set failed (the build step still
        # shows red so failures stay visible).
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- data/limited-stats && [ -z "$(git ls-files --others --exclude-standard data/limited-stats)" ]; then
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/limited-stats
          git commit -m "chore: refresh 17Lands public-dataset limited stats"
          git push
